name: Build ORSPEX PDF Compressor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyinstaller

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed `
            --name "ORSPEX PDF Compressor" `
            --icon "assets\orspex.ico" `
            --add-data "assets\orspex.ico;assets" `
            --add-data "assets\orspex.png;assets" `
            pdf_compressor.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORSPEX-PDF-Compressor-windows
          path: dist/ORSPEX PDF Compressor.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORSPEX PDF Compressor.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}